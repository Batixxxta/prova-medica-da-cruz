<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Prova Médica da Cruz</title>
<style>
  :root{
    --bg:#0b0908;
    --gold:#d8ab5c;
    --gold-glow:rgba(216,171,92,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; padding:0;
    background:var(--bg);
    color:#e9decb;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  .stage{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
  }
  .stage img{
    display:block;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center;
  }

  .dot{
    position:absolute;
    transform:translate(-50%,-50%);
    top:var(--top); left:var(--left);
    width:36px; height:36px;
    border:none; padding:0; cursor:pointer;
    background:none;
    z-index:5;
  }
  .dot .float{
    position:relative;
    display:block;
    width:100%; height:100%;
    animation:var(--dance) var(--dance-dur,6s) ease-in-out infinite;
    animation-delay:var(--dance-delay,0s);
  }
  .dot .ring{
    position:absolute; inset:-4px;
    border-radius:50%;
    background:radial-gradient(circle, var(--gold-glow), transparent 70%);
    animation:pulseRing 2.4s ease-out infinite;
    animation-delay:var(--dance-delay,0s);
  }
  .dot .core{
    position:absolute;
    top:50%; left:50%; transform:translate(-50%,-50%);
    width:30px; height:30px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3d8, var(--gold) 55%, #9c7038);
    box-shadow:0 0 10px 2px var(--gold-glow), 0 0 0 2px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; color:#3a2410;
  }
  @keyframes pulseRing{
    0%{ transform:scale(.55); opacity:.85; }
    75%{ transform:scale(1.9); opacity:0; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  @keyframes danceA{0%{transform:translate(0,0)}25%{transform:translate(5px,-6px)}50%{transform:translate(-3px,4px)}75%{transform:translate(-6px,-3px)}100%{transform:translate(0,0)}}
  @keyframes danceB{0%{transform:translate(0,0)}30%{transform:translate(-6px,-4px)}55%{transform:translate(4px,5px)}80%{transform:translate(3px,-6px)}100%{transform:translate(0,0)}}
  @keyframes danceC{0%{transform:translate(0,0)}20%{transform:translate(4px,6px)}50%{transform:translate(-6px,-2px)}75%{transform:translate(2px,-6px)}100%{transform:translate(0,0)}}

  #p-rosto{ --top:26%; --left:47%; --dance:danceA; --dance-dur:6.2s; --dance-delay:.1s; }
  #p-costas{ --top:34%; --left:21%; --dance:danceB; --dance-dur:5.6s; --dance-delay:.9s; }
  #p-circulacao{ --top:45%; --left:36%; --dance:danceC; --dance-dur:6.8s; --dance-delay:.3s; }
  #p-punhos{ --top:24%; --left:89%; --dance:danceA; --dance-dur:5.9s; --dance-delay:1.4s; }
  #p-ombros{ --top:22%; --left:67%; --dance:danceB; --dance-dur:6.4s; --dance-delay:.6s; }
  #p-peito{ --top:35%; --left:48%; --dance:danceC; --dance-dur:5.7s; --dance-delay:1.8s; }
  #p-lancada{ --top:40%; --left:60%; --dance:danceA; --dance-dur:6.6s; --dance-delay:2.1s; }
  #p-pernas{ --top:62%; --left:46%; --dance:danceB; --dance-dur:6.1s; --dance-delay:1.1s; }
  #p-pes{ --top:83%; --left:47%; --dance:danceC; --dance-dur:5.8s; --dance-delay:.4s; }

  @media(prefers-reduced-motion:reduce){
    .dot .float{ animation:none; }
    .dot .ring{ animation:none; opacity:.5; }
  }

  .below-fold{
    padding:22px 20px 44px;
    text-align:center;
  }
  .aviso{
    display:inline-block;
    font-size:11px;
    color:var(--gold);
    border:1px solid rgba(216,171,92,.35);
    background:rgba(216,171,92,.07);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:14px;
  }
  .referencias{
    font-size:10.5px;
    color:#7a6c5c;
    line-height:1.7;
    max-width:340px;
    margin:0 auto;
  }

  /* visor de imagem */
  .viewer{
    position:fixed; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(6,4,3,0);
    opacity:0; pointer-events:none;
    transition:background .4s ease, opacity .4s ease;
  }
  .viewer.show{ opacity:1; pointer-events:auto; background:rgba(6,4,3,.95); }
  .viewer-zoom{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transform:scale(.04);
    opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
  }
  .viewer-zoom img{
    max-width:100%; max-height:100%;
    touch-action:none;
    will-change:transform;
    transform:translate(0,0) scale(1);
  }
  .viewer-close{
    position:fixed; top:max(14px, env(safe-area-inset-top));
    right:14px; z-index:51;
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(216,171,92,.4);
    background:rgba(0,0,0,.5);
    color:#e9decb;
    font-size:18px; line-height:1;
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .viewer.show ~ .viewer-close,
  .viewer.show .viewer-close{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>

<div class="stage">
  <img src="imagens/hero-crucificacao.jpg" alt="Jesus crucificado">
  <div id="dots"></div>
</div>

<div class="below-fold">
  <div class="aviso">⚠ Recriação médica realista — conteúdo educacional e devocional</div>
  <div class="referencias">
    Baseado em Pierre Barbet, "Em Defesa de Cristo" (Lee Strobel) e no artigo do JAMA (1986) sobre a fisiologia da crucificação romana.
  </div>
</div>

<div class="viewer" id="viewer">
  <button class="viewer-close" id="viewerClose" aria-label="Fechar">✕</button>
  <div class="viewer-zoom" id="viewerZoom">
    <img id="viewerImg" src="" alt="">
  </div>
</div>

<script>
// ordem = sequência do documento-base da pregação
const pontos = [
  { id:"p-rosto",       num:1, img:"imagens/rosto-hematidrose.jpg",         alt:"Hematidrose — Getsêmani" },
  { id:"p-costas",      num:2, img:"imagens/acoite-costas.jpg",             alt:"Açoite romano" },
  { id:"p-circulacao",  num:3, img:"imagens/choque-hipovolemico.jpg",       alt:"Choque hipovolêmico" },
  { id:"p-punhos",      num:4, img:"imagens/punhos.jpg",                    alt:"Os pregos e o nervo mediano" },
  { id:"p-ombros",      num:5, img:"imagens/ombros.jpg",                    alt:"Ombros deslocados" },
  { id:"p-peito",       num:6, img:"imagens/asfixia-tetania-toracica.jpg",  alt:"Tetania e asfixia" },
  { id:"p-lancada",     num:7, img:"imagens/lancada-efusao-pericardica.jpg",alt:"A lançada" },
  { id:"p-pernas",      num:8, img:"imagens/pernas.jpg",                    alt:"Pernas não quebradas" },
  { id:"p-pes",         num:9, img:"imagens/pes.jpg",                       alt:"Achado arqueológico" },
];

const stage = document.getElementById("dots");
pontos.forEach(p => {
  const btn = document.createElement("button");
  btn.className = "dot";
  btn.id = p.id;
  btn.setAttribute("aria-label", p.alt);
  btn.innerHTML = `<span class="float"><span class="ring"></span><span class="core">${p.num}</span></span>`;
  btn.addEventListener("click", (e) => abrir(p, e));
  stage.appendChild(btn);
});

const viewer = document.getElementById("viewer");
const viewerZoom = document.getElementById("viewerZoom");
const viewerImg = document.getElementById("viewerImg");
const viewerClose = document.getElementById("viewerClose");

function abrir(p, ev){
  const rect = ev.currentTarget.getBoundingClientRect();
  const ox = rect.left + rect.width/2 + "px";
  const oy = rect.top + rect.height/2 + "px";
  viewerImg.src = p.img;
  viewerImg.alt = p.alt;
  resetZoomImg();
  viewerZoom.style.transformOrigin = ox + " " + oy;
  viewerZoom.style.transform = "scale(.04)";
  viewerZoom.style.opacity = "0";
  viewer.classList.add("show");
  document.body.style.overflow = "hidden";
  void viewerZoom.offsetWidth; // força reflow
  requestAnimationFrame(() => {
    viewerZoom.style.transform = "scale(1)";
    viewerZoom.style.opacity = "1";
  });
}
function fechar(){
  viewerZoom.style.transform = "scale(.04)";
  viewerZoom.style.opacity = "0";
  viewer.classList.remove("show");
  document.body.style.overflow = "";
}
viewerClose.addEventListener("click", fechar);
viewer.addEventListener("click", e => { if(e.target === viewer) fechar(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") fechar(); });

// pinça pra dar zoom + arrastar quando ampliado + duplo toque reseta
let scale = 1, panX = 0, panY = 0;
let startDist = 0, startScale = 1, startPanX = 0, startPanY = 0, startTouchX = 0, startTouchY = 0;
let lastTap = 0;

function applyImgTransform(){
  viewerImg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}
function resetZoomImg(){
  scale = 1; panX = 0; panY = 0;
  applyImgTransform();
}
function dist(a, b){ return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY); }

viewerImg.addEventListener("touchstart", e => {
  if(e.touches.length === 2){
    startDist = dist(e.touches[0], e.touches[1]);
    startScale = scale;
  } else if(e.touches.length === 1 && scale > 1){
    startTouchX = e.touches[0].clientX - panX;
    startTouchY = e.touches[0].clientY - panY;
  }
}, { passive:true });

viewerImg.addEventListener("touchmove", e => {
  if(e.touches.length === 2){
    e.preventDefault();
    const d = dist(e.touches[0], e.touches[1]);
    scale = Math.min(5, Math.max(1, startScale * (d / startDist)));
    applyImgTransform();
  } else if(e.touches.length === 1 && scale > 1){
    e.preventDefault();
    panX = e.touches[0].clientX - startTouchX;
    panY = e.touches[0].clientY - startTouchY;
    applyImgTransform();
  }
}, { passive:false });

viewerImg.addEventListener("touchend", e => {
  if(e.touches.length === 0){
    if(scale <= 1) resetZoomImg();
    const now = Date.now();
    if(now - lastTap < 300) resetZoomImg();
    lastTap = now;
  }
});
</script>

</body>
</html>
