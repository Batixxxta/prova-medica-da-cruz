<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Prova Médica da Cruz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0908;
    --gold:#d8ab5c;
    --gold-glow:rgba(216,171,92,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; padding:0;
    background:var(--bg);
    color:#e9decb;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  /* palco: fundo borrado full-bleed + moldura no aspecto exato da foto,
     assim a imagem NUNCA é cortada (evita bolinha caindo fora do corpo
     em celulares com proporção de tela diferente) */
  .stage{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:#000;
    display:flex; align-items:center; justify-content:center;
  }
  .stage-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:blur(38px) brightness(.42) saturate(1.15);
    transform:scale(1.18); /* some blur não mostre borda transparente */
  }
  .frame{
    position:relative;
    z-index:1;
    height:100%; width:auto;
    max-width:100%; max-height:100%;
    aspect-ratio:720/1280;
  }
  .frame img.fg{
    display:block;
    width:100%; height:100%;
    object-fit:contain;
  }

  .dot{
    position:absolute;
    transform:translate(-50%,-50%);
    top:var(--top); left:var(--left);
    width:34px; height:34px;
    border:none; padding:0; cursor:pointer;
    background:none;
    z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .dot .float{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width:15px; height:15px;
    animation:var(--dance) var(--dance-dur,5s) ease-in-out infinite;
    animation-delay:var(--dance-delay,0s);
  }
  .dot .ring{
    position:absolute; inset:-3px;
    border-radius:50%;
    background:radial-gradient(circle, var(--gold-glow), transparent 70%);
    animation:pulseRing 2.4s ease-out infinite;
    animation-delay:var(--dance-delay,0s);
    opacity:.55;
  }
  .dot .core{
    position:relative;
    width:15px; height:15px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3d8, var(--gold) 55%, #9c7038);
    box-shadow:0 0 6px 1px var(--gold-glow), 0 0 0 1.5px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:8px; color:#3a2410;
    opacity:.6;
  }
  @keyframes pulseRing{
    0%{ transform:scale(.55); opacity:.6; }
    75%{ transform:scale(2.1); opacity:0; }
    100%{ transform:scale(2.1); opacity:0; }
  }
  /* balanço bem mais perceptível (pedido dele) */
  @keyframes danceA{0%{transform:translate(0,0)}25%{transform:translate(16px,-19px)}50%{transform:translate(-10px,13px)}75%{transform:translate(-17px,-9px)}100%{transform:translate(0,0)}}
  @keyframes danceB{0%{transform:translate(0,0)}30%{transform:translate(-17px,-13px)}55%{transform:translate(12px,15px)}80%{transform:translate(10px,-17px)}100%{transform:translate(0,0)}}
  @keyframes danceC{0%{transform:translate(0,0)}20%{transform:translate(12px,17px)}50%{transform:translate(-17px,-8px)}75%{transform:translate(8px,-17px)}100%{transform:translate(0,0)}}

  #p-rosto{ --top:24%; --left:49%; --dance:danceA; --dance-dur:5.2s; --dance-delay:.1s; }
  #p-costas{ --top:32%; --left:34%; --dance:danceB; --dance-dur:4.7s; --dance-delay:.9s; }
  #p-circulacao{ --top:34%; --left:44%; --dance:danceC; --dance-dur:5.6s; --dance-delay:.3s; }
  #p-punhos{ --top:23%; --left:90%; --dance:danceA; --dance-dur:4.9s; --dance-delay:1.4s; }
  #p-ombros{ --top:26%; --left:77%; --dance:danceB; --dance-dur:5.4s; --dance-delay:.6s; }
  #p-peito{ --top:31%; --left:50%; --dance:danceC; --dance-dur:4.8s; --dance-delay:1.8s; }
  #p-lancada{ --top:36%; --left:61%; --dance:danceA; --dance-dur:5.5s; --dance-delay:2.1s; }
  #p-pernas{ --top:58%; --left:48%; --dance:danceB; --dance-dur:5.1s; --dance-delay:1.1s; }
  #p-pes{ --top:79%; --left:49%; --dance:danceC; --dance-dur:4.8s; --dance-delay:.4s; }

  @media(prefers-reduced-motion:reduce){
    .dot .ring{ animation:none; opacity:.5; }
  }

  .titulo{
    position:absolute;
    top:calc(env(safe-area-inset-top, 0px) + 30px);
    left:0; right:0;
    text-align:center;
    margin:0;
    padding:0 16px;
    z-index:4;
    pointer-events:none;
  }
  .titulo .linha1{
    display:block;
    font-family:"Cinzel", "Segoe UI", serif;
    font-weight:600;
    font-size:clamp(12px,3.4vw,15px);
    letter-spacing:.42em;
    text-indent:.42em;
    color:#c9b083;
    opacity:0;
    animation:linha1Entra 1.1s ease forwards .2s;
  }
  .titulo .linha2{
    display:block;
    margin-top:6px;
    font-family:"Cinzel", "Segoe UI", serif;
    font-weight:800;
    font-size:clamp(20px,6.4vw,30px);
    letter-spacing:.03em;
    line-height:1.15;
    background:linear-gradient(180deg, #fff6e2 0%, #e9c179 45%, #a9772f 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    filter:drop-shadow(0 2px 14px rgba(0,0,0,.85));
    opacity:0;
    transform:translateY(-14px) scale(.95);
    animation:linha2Entra 1.3s cubic-bezier(.2,.8,.2,1) forwards .55s;
  }
  .titulo .flourish{
    display:block;
    margin:8px auto 0;
    width:64px; height:1.5px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0;
    animation:flourishEntra 1s ease forwards 1s;
  }
  @keyframes linha1Entra{ from{opacity:0; letter-spacing:.15em;} to{opacity:.9; letter-spacing:.42em;} }
  @keyframes linha2Entra{ from{opacity:0; transform:translateY(-14px) scale(.95);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes flourishEntra{ from{opacity:0; width:0;} to{opacity:.8; width:64px;} }

  @media(prefers-reduced-motion:reduce){
    .titulo .linha1, .titulo .linha2, .titulo .flourish{ animation:none; opacity:1; }
  }

  .below-fold{
    padding:22px 20px 44px;
    text-align:center;
  }
  .referencias{
    font-size:10.5px;
    color:#7a6c5c;
    line-height:1.7;
    max-width:340px;
    margin:0 auto;
  }

  /* visor de imagem */
  .viewer{
    position:fixed; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .4s ease;
    overflow:hidden;
  }
  .viewer.show{ opacity:1; pointer-events:auto; }
  .viewer-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:blur(30px) brightness(.35) saturate(1.1);
    transform:scale(1.15);
  }
  .viewer-shade{
    position:absolute; inset:0;
    background:rgba(6,4,3,.55);
  }
  .viewer-zoom{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transform:scale(.04);
    opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
  }
  .viewer-zoom img{
    max-width:92%; max-height:92%;
    touch-action:none;
    will-change:transform;
    transform:translate(0,0) scale(1);
    filter:drop-shadow(0 10px 40px rgba(0,0,0,.6));
  }
  .viewer-close{
    position:fixed; top:max(14px, env(safe-area-inset-top));
    right:14px; z-index:51;
    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(216,171,92,.4);
    background:rgba(0,0,0,.5);
    color:#e9decb;
    font-size:18px; line-height:1;
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .viewer.show ~ .viewer-close,
  .viewer.show .viewer-close{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>

<div class="stage">
  <img class="stage-bg" src="imagens/hero-crucificacao.jpg" alt="" aria-hidden="true">
  <div class="frame">
    <img class="fg" src="imagens/hero-crucificacao.jpg" alt="Jesus crucificado">
    <div id="dots"></div>
  </div>
  <h1 class="titulo">
    <span class="linha1">EM DEFESA DA CRUZ</span>
    <span class="linha2">Aos Olhos da Medicina</span>
    <span class="flourish"></span>
  </h1>
</div>

<div class="below-fold">
  <div class="referencias">
    Baseado em Pierre Barbet, "Em Defesa de Cristo" (Lee Strobel) e no artigo do JAMA (1986) sobre a fisiologia da crucificação romana.
  </div>
</div>

<div class="viewer" id="viewer">
  <img class="viewer-bg" src="imagens/hero-crucificacao.jpg" alt="" aria-hidden="true">
  <div class="viewer-shade"></div>
  <button class="viewer-close" id="viewerClose" aria-label="Fechar">✕</button>
  <div class="viewer-zoom" id="viewerZoom">
    <img id="viewerImg" src="" alt="">
  </div>
</div>

<script>
// ordem = sequência do documento-base da pregação
const pontos = [
  { id:"p-rosto",       num:1, img:"imagens/rosto-hematidrose.jpg",         alt:"Hematidrose — Getsêmani" },
  { id:"p-costas",      num:2, img:"imagens/acoite-costas.jpg",             alt:"Açoite romano" },
  { id:"p-circulacao",  num:3, img:"imagens/choque-hipovolemico.jpg",       alt:"Choque hipovolêmico" },
  { id:"p-punhos",      num:4, img:"imagens/punhos.jpg",                    alt:"Os pregos e o nervo mediano" },
  { id:"p-ombros",      num:5, img:"imagens/ombros.jpg",                    alt:"Ombros deslocados" },
  { id:"p-peito",       num:6, img:"imagens/asfixia-tetania-toracica.jpg",  alt:"Tetania e asfixia" },
  { id:"p-lancada",     num:7, img:"imagens/lancada-efusao-pericardica.jpg",alt:"A lançada" },
  { id:"p-pernas",      num:8, img:"imagens/pernas.jpg",                    alt:"Pernas não quebradas" },
  { id:"p-pes",         num:9, img:"imagens/pes.jpg",                       alt:"Achado arqueológico" },
];

const stage = document.getElementById("dots");
pontos.forEach(p => {
  const btn = document.createElement("button");
  btn.className = "dot";
  btn.id = p.id;
  btn.setAttribute("aria-label", p.alt);
  btn.innerHTML = `<span class="float"><span class="ring"></span><span class="core">${p.num}</span></span>`;
  btn.addEventListener("click", (e) => abrir(p, e));
  stage.appendChild(btn);
});

const viewer = document.getElementById("viewer");
const viewerZoom = document.getElementById("viewerZoom");
const viewerImg = document.getElementById("viewerImg");
const viewerClose = document.getElementById("viewerClose");

function abrir(p, ev){
  const rect = ev.currentTarget.getBoundingClientRect();
  const ox = rect.left + rect.width/2 + "px";
  const oy = rect.top + rect.height/2 + "px";
  viewerImg.src = p.img;
  viewerImg.alt = p.alt;
  resetZoomImg();
  viewerZoom.style.transformOrigin = ox + " " + oy;
  viewerZoom.style.transform = "scale(.04)";
  viewerZoom.style.opacity = "0";
  viewer.classList.add("show");
  document.body.style.overflow = "hidden";
  void viewerZoom.offsetWidth; // força reflow
  requestAnimationFrame(() => {
    viewerZoom.style.transform = "scale(1)";
    viewerZoom.style.opacity = "1";
  });
}
function fechar(){
  viewerZoom.style.transform = "scale(.04)";
  viewerZoom.style.opacity = "0";
  viewer.classList.remove("show");
  document.body.style.overflow = "";
}
viewerClose.addEventListener("click", fechar);
viewer.addEventListener("click", e => { if(e.target === viewer) fechar(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") fechar(); });

// pinça pra dar zoom + arrastar quando ampliado + duplo toque reseta
let scale = 1, panX = 0, panY = 0;
let startDist = 0, startScale = 1, startPanX = 0, startPanY = 0, startTouchX = 0, startTouchY = 0;
let lastTap = 0;

function applyImgTransform(){
  viewerImg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}
function resetZoomImg(){
  scale = 1; panX = 0; panY = 0;
  applyImgTransform();
}
function dist(a, b){ return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY); }

viewerImg.addEventListener("touchstart", e => {
  if(e.touches.length === 2){
    startDist = dist(e.touches[0], e.touches[1]);
    startScale = scale;
  } else if(e.touches.length === 1 && scale > 1){
    startTouchX = e.touches[0].clientX - panX;
    startTouchY = e.touches[0].clientY - panY;
  }
}, { passive:true });

viewerImg.addEventListener("touchmove", e => {
  if(e.touches.length === 2){
    e.preventDefault();
    const d = dist(e.touches[0], e.touches[1]);
    scale = Math.min(5, Math.max(1, startScale * (d / startDist)));
    applyImgTransform();
  } else if(e.touches.length === 1 && scale > 1){
    e.preventDefault();
    panX = e.touches[0].clientX - startTouchX;
    panY = e.touches[0].clientY - startTouchY;
    applyImgTransform();
  }
}, { passive:false });

viewerImg.addEventListener("touchend", e => {
  if(e.touches.length === 0){
    if(scale <= 1) resetZoomImg();
    const now = Date.now();
    if(now - lastTap < 300) resetZoomImg();
    lastTap = now;
  }
});
</script>

</body>
</html>
